  <path d="M229 103 221 122" stroke="#efe5cc" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M229 103h-25" stroke="#c2d9ce" stroke-width="2.8" stroke-linecap="round"/>
  <path d="m225 97 15 25" stroke="#d8b06c" stroke-width=".9"/>
  <circle cx="229" cy="103" r="3.2" fill="url(#shift-gold)"/>
  <path d="M202 79c10-10 23-13 34-9" stroke="#cce3de" stroke-width="2.5" opacity=".38" stroke-linecap="round"/>
 </g>
 <!-- Two removable shift cards with simple, nonverbal day/night markers. -->
 <g transform="rotate(-5 156 145)" filter="url(#shift-objectShadow)">
