<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" fill="none" role="img" aria-labelledby="shift-title shift-desc"><title id="shift-title">Vuorosuunnitelma</title><desc id="shift-desc">Kaksi eri aikaa näyttävää kelloa ja päivä- sekä yövuoron suunnittelukortit.</desc><defs>
 <linearGradient id="shift-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset=".6" stop-color="#faf6e9"/><stop offset="1" stop-color="#e7e1d1"/></linearGradient>
 <linearGradient id="shift-navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#426780"/><stop offset=".3" stop-color="#234b67"/><stop offset=".7" stop-color="#12374f"/><stop offset="1" stop-color="#09283d"/></linearGradient>
 <linearGradient id="shift-navySide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d56"/><stop offset="1" stop-color="#071f31"/></linearGradient>
 <linearGradient id="shift-ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2f0e7"/><stop offset=".45" stop-color="#beddd0"/><stop offset="1" stop-color="#7eaea1"/></linearGradient>
 <linearGradient id="shift-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcfa"/><stop offset=".16" stop-color="#bfcacb"/><stop offset=".4" stop-color="#eff4f0"/><stop offset=".68" stop-color="#8a9fa3"/><stop offset=".85" stop-color="#b8c9c9"/><stop offset="1" stop-color="#657e85"/></linearGradient>
 <linearGradient id="shift-wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2c6a0"/><stop offset=".4" stop-color="#cda777"/><stop offset="1" stop-color="#a77c50"/></linearGradient>
 <linearGradient id="shift-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9e9be"/><stop offset=".32" stop-color="#d8bd82"/><stop offset=".62" stop-color="#f1deb2"/><stop offset="1" stop-color="#a88852"/></linearGradient>
 <radialGradient id="shift-face" cx=".34" cy=".22" r=".95"><stop stop-color="#fffef9"/><stop offset=".7" stop-color="#eff1e8"/><stop offset="1" stop-color="#d5e0dc"/></radialGradient>
 <radialGradient id="shift-faceDark" cx=".3" cy=".24" r=".9"><stop stop-color="#325c73"/><stop offset=".55" stop-color="#173f57"/><stop offset="1" stop-color="#09283e"/></radialGradient>
 <linearGradient id="shift-pencilPaint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#143c55"/><stop offset=".35" stop-color="#567f8c"/><stop offset=".52" stop-color="#9ab6ad"/><stop offset=".67" stop-color="#3c6c7b"/><stop offset="1" stop-color="#12364c"/></linearGradient>
 <filter id="shift-softShadow" x="-.5" y="-.8" width="2" height="2.6"><feGaussianBlur stdDeviation="4"/></filter>
 <filter id="shift-objectShadow" x="-.25" y="-.25" width="1.6" height="1.7"><feDropShadow dx="1.5" dy="4" stdDeviation="3" flood-color="#163143" flood-opacity=".14"/></filter>
 </defs>
 <ellipse cx="177" cy="160" rx="113" ry="9" fill="#173748" opacity=".14" filter="url(#shift-softShadow)"/>
 <!-- Rear pale-faced clock with a continuous beveled shell. -->
